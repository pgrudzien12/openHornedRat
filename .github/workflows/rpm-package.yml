name: RPM package

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: rpm-package-daily
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      checkout_ref: ${{ steps.target.outputs.checkout_ref }}
      version: ${{ steps.target.outputs.version }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      daily_tag: ${{ steps.target.outputs.daily_tag }}
      daily_date: ${{ steps.target.outputs.daily_date }}
      cache_key: ${{ steps.target.outputs.cache_key }}
      source_cached: ${{ steps.source-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose one pending tag or the default branch
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          release_tag=""
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              release_tag="${GITHUB_REF#refs/tags/}"
            fi
          else
            while IFS= read -r tag; do
              [[ "$tag" =~ ^v[0-9]+[A-Za-z0-9.+~-]*$ ]] || continue
              git cat-file -e "$tag:packaging/linux/build-rpm.sh" 2>/dev/null || continue
              if ! assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/tmp/ohr-release-error); then
                if grep -qi 'not found' /tmp/ohr-release-error; then
                  assets=""
                else
                  cat /tmp/ohr-release-error >&2
                  exit 1
                fi
              fi
              if ! grep -Eq '^ohr-engine-.*\.x86_64\.rpm$' <<< "$assets"; then
                release_tag="$tag"
                break
              fi
            done < <(git tag --list 'v*' --sort=version:refname)
          fi
          if [[ -n "$release_tag" ]]; then
            checkout_ref="$release_tag"
            echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          else
            checkout_ref="$(git rev-parse HEAD)"
            echo "version=0.0.0~dev+${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi
          source_hash=$(git ls-tree -r "$checkout_ref" -- packaging/linux/ohr-engine.spec packaging/linux/build-rpm.sh packaging/linux/ohr-engine.rpm.spec packaging/linux/ohr-engine-launch packaging/linux/ohr-engine.desktop packaging/THIRD_PARTY_NOTICES.md packaging/licenses requirements-engine.txt whshr scripts LICENSE LEGAL.md packaging/windows/entrypoint.py .github/workflows/rpm-package.yml | sha256sum | cut -d' ' -f1)
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "cache_key=ohr-rpm-v1-$source_hash" >> "$GITHUB_OUTPUT"
          if [[ -z "$release_tag" ]] && { [[ "$GITHUB_EVENT_NAME" == schedule ]] || [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; }; then
            echo "daily_tag=daily-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
            echo "daily_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check previous successful build
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: build/package-cache/rpm-success
          key: ${{ steps.target.outputs.cache_key }}

  build:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.release_tag != '' || needs.plan.outputs.source_cached != 'true'
    runs-on: ubuntu-24.04
    container: rockylinux:9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.checkout_ref }}

      - name: Install build tools
        run: dnf install -y python3.11 python3.11-pip rpm-build binutils libglvnd-glx libX11 cpio

      - name: Install Python build dependencies
        run: |
          python3.11 -m venv /tmp/ohr-build-venv
          /tmp/ohr-build-venv/bin/pip install --only-binary=:all: -r requirements-engine.txt pyinstaller

      - name: Freeze engine
        run: /tmp/ohr-build-venv/bin/pyinstaller packaging/linux/ohr-engine.spec --distpath dist --workpath build/pyinstaller --noconfirm

      - name: Smoke-test frozen engine
        shell: bash
        run: |
          set -euo pipefail
          ./dist/ohr-engine/ohr-engine --help >/dev/null
          mkdir -p /tmp/fake-warfb
          output=$(WARFB=/tmp/fake-warfb ./dist/ohr-engine/ohr-engine --hidden --frames 1 2>&1) && exit 1 || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q 'incomplete WARFB installation' <<< "$output"
          ! grep -Eq 'ModuleNotFoundError|ImportError' <<< "$output"

      - name: Build RPM
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
        run: sh packaging/linux/build-rpm.sh "$PACKAGE_VERSION"

      - name: Check RPM contents
        shell: bash
        run: |
          set -euo pipefail
          package=(dist/rpm/*.rpm)
          test "${#package[@]}" -eq 1
          rpm -qp --queryformat '%{NAME} %{VERSION} %{RELEASE} %{ARCH}\n' "${package[0]}"
          package_path="$PWD/${package[0]}"
          mkdir -p /tmp/ohr-rpm-check
          (cd /tmp/ohr-rpm-check && rpm2cpio "$package_path" | cpio -idm --quiet)
          test -f /tmp/ohr-rpm-check/usr/share/applications/ohr-engine.desktop
          test -L /tmp/ohr-rpm-check/usr/bin/ohr-engine
          /tmp/ohr-rpm-check/opt/ohr-engine/ohr-engine --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ohr-engine-rpm-x86_64
          path: dist/rpm/*.rpm

  remember:
    if: >-
      always() && needs.build.result == 'success' && needs.plan.outputs.source_cached != 'true' &&
      ((needs.plan.outputs.release_tag != '' && needs.release.result == 'success') ||
       (needs.plan.outputs.daily_tag != '' && needs.daily_release.result == 'success') ||
       (needs.plan.outputs.release_tag == '' && needs.plan.outputs.daily_tag == ''))
    needs: [plan, build, release, daily_release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record successful package source
        run: |
          mkdir -p build/package-cache
          printf 'built\n' > build/package-cache/rpm-success

      - uses: actions/cache/save@v4
        with:
          path: build/package-cache/rpm-success
          key: ${{ needs.plan.outputs.cache_key }}

  release:
    if: needs.plan.outputs.release_tag != ''
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ohr-engine-rpm-x86_64
          path: release

      - name: Attach RPM to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          files: release/*.rpm

  daily_release:
    if: needs.plan.outputs.daily_tag != ''
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ohr-engine-rpm-x86_64
          path: release

      - name: Publish daily prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.daily_tag }}
          target_commitish: ${{ needs.plan.outputs.checkout_ref }}
          name: Daily build ${{ needs.plan.outputs.daily_date }}
          prerelease: true
          make_latest: false
          body: Automated playtest packages. Asset names identify the source commit. Bring your own legally owned WARFB game files; they are not included.
          files: release/*.rpm
