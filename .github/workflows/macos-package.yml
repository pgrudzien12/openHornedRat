name: macOS package

# The weekly check uses a cheap Linux runner. A macOS runner starts only when
# package inputs changed, a release tag needs an asset, or the workflow is run manually.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

concurrency:
  group: macos-package-weekly
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      checkout_ref: ${{ steps.target.outputs.checkout_ref }}
      version: ${{ steps.target.outputs.version }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      weekly_tag: ${{ steps.target.outputs.weekly_tag }}
      weekly_date: ${{ steps.target.outputs.weekly_date }}
      cache_key: ${{ steps.target.outputs.cache_key }}
      source_cached: ${{ steps.source-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Choose one pending tag or the default branch
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          release_tag=""
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              release_tag="${GITHUB_REF#refs/tags/}"
            fi
          else
            while IFS= read -r tag; do
              [[ "$tag" =~ ^v[0-9]+[A-Za-z0-9.+~-]*$ ]] || continue
              git cat-file -e "$tag:packaging/macos/build-pkg.sh" 2>/dev/null || continue
              if ! assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/tmp/ohr-release-error); then
                if grep -qi 'not found' /tmp/ohr-release-error; then
                  assets=""
                else
                  cat /tmp/ohr-release-error >&2
                  exit 1
                fi
              fi
              if ! grep -Eq '^ohr-engine-.*-macos-arm64\.pkg$' <<< "$assets"; then
                release_tag="$tag"
                break
              fi
            done < <(git tag --list 'v*' --sort=version:refname)
          fi
          if [[ -n "$release_tag" ]]; then
            checkout_ref="$release_tag"
            echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          else
            checkout_ref="$(git rev-parse HEAD)"
            echo "version=0.0.0-dev+${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi
          source_hash=$(git ls-tree -r "$checkout_ref" -- packaging/linux/ohr-engine.spec packaging/macos packaging/windows/entrypoint.py packaging/THIRD_PARTY_NOTICES.md packaging/licenses requirements-engine.txt whshr scripts LICENSE LEGAL.md .github/workflows/macos-package.yml | sha256sum | cut -d' ' -f1)
          cache_key="ohr-macos-arm64-v1-$source_hash"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"
          if [[ -z "$release_tag" ]] && { [[ "$GITHUB_EVENT_NAME" == schedule ]] || [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; }; then
            echo "weekly_tag=weekly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
            echo "weekly_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check previous successful build
        id: source-cache
        uses: actions/cache/restore@v5
        with:
          path: build/package-cache/success
          key: ${{ steps.target.outputs.cache_key }}

  build:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.release_tag != '' || needs.plan.outputs.source_cached != 'true'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.checkout_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements-engine.txt pyinstaller

      - name: Freeze engine
        run: pyinstaller packaging/linux/ohr-engine.spec --distpath dist --workpath build/pyinstaller --noconfirm

      - name: Smoke-test frozen engine
        shell: bash
        run: |
          set -euo pipefail
          ./dist/ohr-engine/ohr-engine --help >/dev/null
          mkdir -p /tmp/fake-warfb
          output=$(WARFB=/tmp/fake-warfb ./dist/ohr-engine/ohr-engine --hidden --frames 1 2>&1) && exit 1 || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q 'incomplete WARFB installation' <<< "$output"
          ! grep -Eq 'ModuleNotFoundError|ImportError' <<< "$output"

      - name: Build macOS installer package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
        run: sh packaging/macos/build-pkg.sh "$PACKAGE_VERSION"

      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail
          package=(dist/macos/*.pkg)
          pkgutil --payload-files "${package[0]}" > /tmp/ohr-macos-payload.txt
          grep -Eq '(^|/)usr/local/bin/ohr-engine$' /tmp/ohr-macos-payload.txt
          grep -Eq '(^|/)usr/local/lib/ohr-engine/ohr-engine$' /tmp/ohr-macos-payload.txt
          grep -Eq '(^|/)usr/local/share/doc/ohr-engine/THIRD_PARTY_NOTICES.md$' /tmp/ohr-macos-payload.txt

      - uses: actions/upload-artifact@v6
        with:
          name: ohr-engine-macos-arm64
          path: dist/macos/*.pkg
          retention-days: 7

  remember:
    if: >-
      always() && needs.build.result == 'success' && needs.plan.outputs.source_cached != 'true' &&
      ((needs.plan.outputs.release_tag != '' && needs.release.result == 'success') ||
       (needs.plan.outputs.weekly_tag != '' && needs.weekly_release.result == 'success') ||
       (needs.plan.outputs.release_tag == '' && needs.plan.outputs.weekly_tag == ''))
    needs: [plan, build, release, weekly_release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record successful package source
        run: |
          mkdir -p build/package-cache
          printf 'built\n' > build/package-cache/success

      - uses: actions/cache/save@v5
        with:
          path: build/package-cache/success
          key: ${{ needs.plan.outputs.cache_key }}

  release:
    if: needs.plan.outputs.release_tag != ''
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ohr-engine-macos-arm64
          path: release

      - name: Attach package to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          files: release/*.pkg

  weekly_release:
    if: needs.plan.outputs.weekly_tag != ''
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ohr-engine-macos-arm64
          path: release

      - name: Publish weekly prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.weekly_tag }}
          target_commitish: ${{ needs.plan.outputs.checkout_ref }}
          name: Weekly macOS build ${{ needs.plan.outputs.weekly_date }}
          prerelease: true
          make_latest: false
          body: Automated unsigned Apple Silicon installer package. Bring your own legally owned WARFB game files; they are not included.
          files: release/*.pkg
