name: Windows installer

# Builds the Windows installer (issue #97) on a native windows-latest runner (PyInstaller
# does not support cross-compilation; ISCC and a Python new enough for pygame-ce/zengl's
# published wheels both ship on this runner image already). The daily run builds one
# unprocessed v* tag, or the default branch when no tag needs a release asset.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: windows-installer-daily
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      checkout_ref: ${{ steps.target.outputs.checkout_ref }}
      version: ${{ steps.target.outputs.version }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      daily_tag: ${{ steps.target.outputs.daily_tag }}
      daily_date: ${{ steps.target.outputs.daily_date }}
      cache_key: ${{ steps.target.outputs.cache_key }}
      source_cached: ${{ steps.source-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Choose one pending tag or the default branch
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          release_tag=""
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              release_tag="${GITHUB_REF#refs/tags/}"
            fi
          else
            while IFS= read -r tag; do
              [[ "$tag" =~ ^v[0-9]+[A-Za-z0-9.+~-]*$ ]] || continue
              git cat-file -e "$tag:packaging/windows/ohr-engine.spec" 2>/dev/null || continue
              if ! assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/tmp/ohr-release-error); then
                if grep -qi 'not found' /tmp/ohr-release-error; then
                  assets=""
                else
                  cat /tmp/ohr-release-error >&2
                  exit 1
                fi
              fi
              if ! grep -Eq '^ohr-engine-setup-.*\.exe$' <<< "$assets"; then
                release_tag="$tag"
                break
              fi
            done < <(git tag --list 'v*' --sort=version:refname)
          fi
          if [[ -n "$release_tag" ]]; then
            checkout_ref="$release_tag"
            echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          else
            checkout_ref="$(git rev-parse HEAD)"
            echo "version=0.0.0-dev+${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi
          source_hash=$(git ls-tree -r "$checkout_ref" -- packaging/windows packaging/entrypoint.py packaging/THIRD_PARTY_NOTICES.md packaging/licenses requirements-engine.txt whshr scripts LICENSE .github/workflows/windows-installer.yml | sha256sum | cut -d' ' -f1)
          cache_key="ohr-windows-v1-$source_hash"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"
          if [[ -z "$release_tag" ]] && { [[ "$GITHUB_EVENT_NAME" == schedule ]] || [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; }; then
            echo "daily_tag=daily-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
            echo "daily_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check previous successful build
        id: source-cache
        uses: actions/cache/restore@v5
        with:
          path: build/package-cache/success
          key: ${{ steps.target.outputs.cache_key }}

  build:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.release_tag != '' || needs.plan.outputs.source_cached != 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.checkout_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install engine dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements-engine.txt pyinstaller

      - name: Freeze with PyInstaller
        run: pyinstaller packaging/windows/ohr-engine.spec --distpath dist --workpath build --noconfirm

      - name: Smoke-test the frozen executable
        shell: bash
        # A windowed PyInstaller exe does not expose stdout/stderr to this shell. The
        # self-check imports Tk and the engine's native dependencies and returns failure
        # if any import fails, without opening a window or requiring game files.
        run: |
          ./dist/ohr-engine/ohr-engine.exe --check-bundle

      - name: Compile installer with Inno Setup
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:INSTALLER_VERSION" packaging\windows\installer.iss

      - uses: actions/upload-artifact@v6
        with:
          name: ohr-engine-windows-installer
          path: dist/installer/*.exe

  remember:
    if: >-
      always() && needs.build.result == 'success' && needs.plan.outputs.source_cached != 'true' &&
      ((needs.plan.outputs.release_tag != '' && needs.release.result == 'success') ||
       (needs.plan.outputs.daily_tag != '' && needs.daily_release.result == 'success') ||
       (needs.plan.outputs.release_tag == '' && needs.plan.outputs.daily_tag == ''))
    needs: [plan, build, release, daily_release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record successful package source
        run: |
          mkdir -p build/package-cache
          printf 'built\n' > build/package-cache/success

      - uses: actions/cache/save@v5
        with:
          path: build/package-cache/success
          key: ${{ needs.plan.outputs.cache_key }}

  release:
    if: needs.plan.outputs.release_tag != ''
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ohr-engine-windows-installer
          path: release

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          files: release/*.exe

  daily_release:
    if: needs.plan.outputs.daily_tag != ''
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ohr-engine-windows-installer
          path: release

      - name: Publish daily prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.daily_tag }}
          target_commitish: ${{ needs.plan.outputs.checkout_ref }}
          name: Daily build ${{ needs.plan.outputs.daily_date }}
          prerelease: true
          make_latest: false
          body: Automated playtest packages. Asset names identify the source commit. Bring your own legally owned WARFB game files; they are not included.
          files: release/*.exe
